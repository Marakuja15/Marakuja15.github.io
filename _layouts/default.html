<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#13111a">
    <meta name="description" content="{{ description | default: page.description | default: site.description | escape }}">
    <title>{{ title | default: page.title | default: site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=4">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Piotr — home">
          <span class="brand-name">Piotr <small>SOFTWARE DEVELOPER</small></span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}#work">Projects</a>
          <a href="{{ '/' | relative_url }}#about">About</a>
          <a href="https://github.com/Marakuja15" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>Piotr <span aria-hidden="true">·</span> Software developer</p>
      <a href="{{ '/' | relative_url }}#work">Back to projects ↑</a>
    </footer>
  </body>
</html>
